<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>气球打字 · Balloon Pop</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-row">
        <h1>🎈 气球打字</h1>
        <p class="subtitle">Balloon Pop · 打字消灭上升的气球</p>
      </div>
      <div class="audio-toggles">
        <button type="button" id="btn-music" class="icon-btn active" title="背景音乐" aria-label="切换背景音乐">🎵</button>
        <button type="button" id="btn-sfx" class="icon-btn active" title="音效" aria-label="切换音效">🔊</button>
      </div>
    </header>

    <div class="hud">
      <div class="stat">
        <span class="label">得分</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">连击</span>
        <span id="combo" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">生命</span>
        <span id="lives" class="value">❤️❤️❤️</span>
      </div>
      <div class="stat">
        <span class="label">最高分</span>
        <span id="best" class="value">0</span>
      </div>
    </div>

    <div class="stage" id="stage" tabindex="0" role="application" aria-label="气球打字游戏区">
      <div id="sky" class="sky" aria-hidden="true"></div>
      <div id="balloons" class="balloons" aria-live="polite"></div>
      <div class="typed-bar" id="typed-bar" aria-hidden="true">
        <span class="typed-label">刚按</span>
        <span id="typed" class="typed-text"></span>
      </div>

      <!-- Start / settings overlay -->
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">🎈 气球打字</h2>
          <p id="overlay-msg">接上蓝牙键盘即可玩。每个气球一个字母；偶尔会触发<strong>彩蛋</strong>——同屏 10 个相同字母，全部打掉有惊喜！</p>

          <div id="settings" class="settings">
            <div class="setting-group">
              <span class="setting-label">难度</span>
              <div class="seg" role="group" aria-label="难度">
                <button type="button" class="seg-btn active" data-diff="easy">简单</button>
                <button type="button" class="seg-btn" data-diff="normal">普通</button>
                <button type="button" class="seg-btn" data-diff="hard">困难</button>
              </div>
            </div>
            <div class="setting-group">
              <span class="setting-label">数字</span>
              <label class="switch">
                <input type="checkbox" id="opt-numbers" />
                <span class="switch-ui"></span>
                <span class="switch-text" id="numbers-label">关闭（仅字母 a–z）</span>
              </label>
            </div>
          </div>

          <div id="result-stats" class="result-stats hidden"></div>
          <button id="start-btn" type="button">开始游戏</button>
        </div>
      </div>
    </div>

    <p class="hint">
      专为 <strong>蓝牙 / 外接键盘</strong> 设计，无需输入框 · 一气球一字母 · <kbd>Esc</kbd> 暂停
    </p>

    <footer class="footer">
      <span>notnotdinner / typing-game</span>
      <a href="https://github.com/notnotdinner/typing-game" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
  <script src="words.js"></script>
  <script src="game.js"></script>
</body>
</html>
